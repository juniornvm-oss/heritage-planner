const CDN = {

  pdf: "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.7.76/build/pdf.min.mjs",

};
const ZONAS_VALIDAS = ["ergo", "forca", "livre", "prep"];
const normHdr = (s) => String(s == null ? "" : s).trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
function pickField(obj, aliases) {
  const keys = Object.keys(obj);
  for (const a of aliases) { const k = keys.find((k) => normHdr(k) === a); if (k != null && obj[k] !== "") return obj[k]; }
  return undefined;
}
function parseNum(v) {
  if (v == null || v === "") return null;
  let s = String(v).replace(/[^\d.,-]/g, ""); if (!s) return null;
  const hasC = s.includes(","), hasD = s.includes(".");
  if (hasC && hasD) s = s.lastIndexOf(",") > s.lastIndexOf(".") ? s.replace(/\./g, "").replace(",", ".") : s.replace(/,/g, "");
  else if (hasC) s = /,\d{2}$/.test(s) ? s.replace(",", ".") : s.replace(/,/g, "");
  else if (hasD && /^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, "");
  const n = Number(s); return Number.isFinite(n) ? n : null;
}
function parseDims(text) {
  const m = String(text).match(/(\d{2,3})\s*[x×]\s*(\d{2,3})/i);
  return m ? { w: Number(m[1]), h: Number(m[2]) } : {};
}
// bbox (min/max) sobre entidades DXF/DWG, resolvendo INSERT — espelha tools/ler.js
function computeBounds(entities, blocks) {
  let b = null;
  const hit = (x, y) => { if (!Number.isFinite(x) || !Number.isFinite(y)) return;
    if (!b) b = { minX: x, maxX: x, minY: y, maxY: y };
    else { if (x < b.minX) b.minX = x; else if (x > b.maxX) b.maxX = x; if (y < b.minY) b.minY = y; else if (y > b.maxY) b.maxY = y; } };
  const acc = (ents, tf) => {
    for (const e of ents || []) {
      const t = (e.type || "").toUpperCase();
      if (t === "LINE" || t === "LWPOLYLINE" || t === "POLYLINE") for (const v of e.vertices || []) tf(v.x, v.y);
      else if (t === "POINT" && e.position) tf(e.position.x, e.position.y);
      else if (t === "CIRCLE" && e.center) { tf(e.center.x - e.radius, e.center.y - e.radius); tf(e.center.x + e.radius, e.center.y + e.radius); }
      else if (t === "ARC" && e.center) { let a0 = e.startAngle, a1 = e.endAngle; if (a1 < a0) a1 += 2 * Math.PI;
        for (let i = 0; i <= 24; i++) { const a = a0 + (a1 - a0) * i / 24; tf(e.center.x + e.radius * Math.cos(a), e.center.y + e.radius * Math.sin(a)); } }
      else if (t === "INSERT" && blocks && blocks[e.name] && blocks[e.name].entities) {
        const p = e.position || { x: 0, y: 0 }, xs = e.xScale || 1, ys = e.yScale || 1;
        const r = -((e.rotation || 0) * Math.PI) / 180, s = Math.sin(r), c = Math.cos(r);
        acc(blocks[e.name].entities, (bx, by) => tf(p.x + bx * xs * c - by * ys * s, p.y + bx * xs * s + by * ys * c));
      }
    }
  };
  acc(entities, hit);
  return b;
}
function boundsToCm(b, unit) {
  if (!b) return null;
  const k = ({ 1: 2.54, 4: 0.1, 5: 1, 6: 100, 0: 0.1 })[unit] != null ? ({ 1: 2.54, 4: 0.1, 5: 1, 6: 100, 0: 0.1 })[unit] : 0.1;
  return { w: Math.max(1, Math.round((b.maxX - b.minX) * k)), h: Math.max(1, Math.round((b.maxY - b.minY) * k)) };
}

// Cada parser devolve { modo: "linhas"|"geometria", linhas?, blocos?, resumo }
async function parseArquivo(file) {
  const nome = file.name, ext = (nome.split(".").pop() || "").toLowerCase();
  if (ext === "csv") {
    const txt = await file.text();
    return { modo: "linhas", linhas: csvParaObjetos(txt), resumo: `${nome}: CSV` };
  }
  if (ext === "xlsx" || ext === "xls") {
    const XLSX = await window.dynImport(CDN.xlsx);
    const wb = XLSX.read(await file.arrayBuffer(), { type: "array" });
    const linhas = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: "" });
    return { modo: "linhas", linhas, resumo: `${nome}: planilha (${linhas.length} linhas)` };
  }
  if (ext === "pdf") {
    const pdfjs = await window.dynImport(CDN.pdf);
    pdfjs.GlobalWorkerOptions.workerSrc = CDN.pdfWorker;
    const doc = await pdfjs.getDocument({ data: await file.arrayBuffer() }).promise;
    let texto = "";
    for (let i = 1; i <= doc.numPages; i++) {
      const c = await (await doc.getPage(i)).getTextContent();
      const linhasPag = {};
      c.items.forEach((it) => { const y = Math.round(it.transform[5]); (linhasPag[y] = linhasPag[y] || []).push(it.str); });
      texto += Object.keys(linhasPag).sort((a, b) => b - a).map((y) => linhasPag[y].join(" ")).join("\n") + "\n";
    }
    return { modo: "linhas", linhas: pdfTextoParaLinhas(texto), resumo: `${nome}: PDF (${doc.numPages} pág.)` };
  }
  if (ext === "dxf") {
    const mod = await window.dynImport(CDN.dxf);
    const DxfParser = mod.default || mod.DxfParser || mod;
    const parsed = new DxfParser().parseSync(await file.text());
    const unit = parsed.header && parsed.header["$INSUNITS"] != null ? parsed.header["$INSUNITS"] : 4;
    const dim = boundsToCm(computeBounds(parsed.entities, parsed.blocks), unit);
    const bn = (parsed.blocks && Object.keys(parsed.blocks).find((n) => n && !n.startsWith("*"))) || nome.replace(/\.[^.]+$/, "");
    if (!dim) throw new Error("Sem geometria no DXF.");
    return { modo: "geometria", blocos: [{ nome: bn, w: dim.w, h: dim.h }], resumo: `${nome}: DXF → ${dim.w}×${dim.h} cm` };
  }
  if (ext === "dwg") {
    const { LibreDwg, Dwg_File_Type } = await window.dynImport(CDN.dwg);
    const lib = await LibreDwg.create();
    const dwg = lib.dwg_read_data(new Uint8Array(await file.arrayBuffer()), Dwg_File_Type.DWG);
    const db = lib.convert(dwg);
    const ents = db.entities || db.blocks && db.blocks.model_space || [];
    const blocks = {};
    (db.blocks || []).forEach((bl) => { if (bl && bl.name) blocks[bl.name] = { entities: bl.entities || [] }; });
    const dim = boundsToCm(computeBounds(ents, blocks), 4);
    try { lib.dwg_free(dwg); } catch (e) {}
    if (!dim) throw new Error("DWG lido, mas sem geometria reconhecida. Me mande o arquivo para calibrar.");
    return { modo: "geometria", blocos: [{ nome: nome.replace(/\.[^.]+$/, ""), w: dim.w, h: dim.h }], resumo: `${nome}: DWG → ${dim.w}×${dim.h} cm` };
  }
  throw new Error("Formato não suportado: ." + ext + " (use csv, xlsx, pdf, dxf, dwg)");
}
function csvParaObjetos(txt) {
  const linhas = txt.replace(/^﻿/, "").split(/\r?\n/).filter((l) => l.trim() !== "");
  if (linhas.length < 2) return [];
  const split = (l) => { const o = []; let c = "", q = false;
    for (let i = 0; i < l.length; i++) { const ch = l[i];
      if (q) { if (ch === '"' && l[i + 1] === '"') { c += '"'; i++; } else if (ch === '"') q = false; else c += ch; }
      else if (ch === '"') q = true; else if (ch === ",") { o.push(c); c = ""; } else c += ch; } o.push(c); return o.map((s) => s.trim()); };
  const hdr = split(linhas[0]);
  return linhas.slice(1).map((l) => { const cs = split(l), o = {}; hdr.forEach((h, i) => { o[h] = cs[i] != null ? cs[i] : ""; }); return o; });
}
function pdfTextoParaLinhas(texto) {
  const out = [];
  for (const raw of texto.split(/\r?\n/)) { const l = raw.trim(); if (!l) continue;
    const m = l.match(/(?:R\$\s*)?(\d[\d.,]*\d)\s*$/); if (!m) continue;
    const valor = parseNum(m[1]); if (valor == null || valor < 1) continue;
    const nm = l.slice(0, l.length - m[0].length).replace(/[.\s]+$/, "").trim(); if (!nm) continue;
    out.push({ nome: nm, valor, ...parseDims(l) }); }
  return out;
}
function mapEquip(o) {
  const d = parseDims([pickField(o, ["dimensoes", "medidas"]) || "", pickField(o, ["nome", "equipamento", "descricao"]) || ""].join(" "));
  let zona = pickField(o, ["zona"]); if (zona && !ZONAS_VALIDAS.includes(String(zona).toLowerCase())) zona = null;
  return {
    nome: (pickField(o, ["nome", "equipamento", "descricao", "item", "produto"]) || "").toString().trim(),
    marca: pickField(o, ["marca", "fabricante"]) || null, modelo: pickField(o, ["modelo"]) || null,
    largura_cm: parseNum(pickField(o, ["largura_cm", "largura", "larg"])) || d.w || null,
    profundidade_cm: parseNum(pickField(o, ["profundidade_cm", "profundidade", "comprimento", "prof"])) || d.h || null,
    zona: zona ? String(zona).toLowerCase() : null, preco: parseNum(pickField(o, ["preco", "valor", "price"])) || 0, fonte_arquivo: "import-app",
  };
}
function mapCot(o, projetoId) {
  return {
    projeto_id: isUuid(projetoId) ? projetoId : null, categoria: pickField(o, ["categoria", "zona"]) || null,
    equipamento: (pickField(o, ["equipamento", "nome", "item", "descricao"]) || "").toString().trim() || null,
    fornecedorNome: (pickField(o, ["fornecedor", "fabricante"]) || "").toString().trim() || null,
    marca: pickField(o, ["marca"]) || null, modelo: pickField(o, ["modelo"]) || null,
    valor: parseNum(pickField(o, ["valor", "preco", "price"])), garantia: pickField(o, ["garantia"]) || null,
    assistencia: pickField(o, ["assistencia", "suporte"]) || null, prazo: pickField(o, ["prazo", "entrega"]) || null,
  };
}

  // ── Boot: carrega catálogo + salas do Supabase (fallback local) ────────────
  useEffect(() => {
    if (!sb) return;
    (async () => {
      let msg = [];
      const cat = await sb.from("equipamentos").select("*").order("nome");
      if (!cat.error && cat.data && cat.data.length) {
        setCatalogo(cat.data.map((e) => ({
          nome: e.nome, w: e.largura_cm, h: e.profundidade_cm,
          zona: e.zona || "livre", preco: e.preco || 0, marca: e.marca, modelo: e.modelo,
        })));
        msg.push(`${cat.data.length} equipamentos`);
      } else if (cat.error) {
        msg.push("catálogo local");
      }
      const sl = await sb.from("salas").select("*").order("criado_em");
      if (!sl.error && sl.data && sl.data.length) {
        const rows = sl.data.map((s) => ({
          id: s.id, nome: s.nome, largura_cm: s.largura_cm, profundidade_cm: s.profundidade_cm,
          config: s.config || {},
        }));
        setSalas(rows);
        setSalaId(rows[0].id);
        msg.push(`${rows.length} sala(s)`);
      }
      const pj = await sb.from("projetos").select("*").order("criado_em");
      if (!pj.error && pj.data && pj.data.length) {
        setProjetos(pj.data);
        msg.push(`${pj.data.length} projeto(s)`);
      }
      setStatus(msg.length ? "Supabase: " + msg.join(" · ") : "Conectado ao Supabase");
    })();
  }, []);

  // Ao selecionar um projeto, carrega a sala vinculada a ele.
  useEffect(() => {
    if (projetoAtual && projetoAtual.sala_id && salas.some((s) => s.id === projetoAtual.sala_id)) {
      setSalaId(projetoAtual.sala_id);
    }
    // eslint-disable-next-line
  }, [projetoId]);

  // ── Ao trocar de sala: carrega o layout dela ───────────────────────────────
  useEffect(() => {
    if (!salaAtual) return;
    let cancel = false;
    (async () => {
      const fallback = salaAtual.nome === "Heritage" ? buildLayoutFromPos(HERITAGE_POS, catalogo) : [];
      if (sb) {
        const { data, error } = await sb.from("layouts").select("dados").eq("nome", slug(salaAtual.nome)).maybeSingle();
        if (cancel) return;
        if (!error && data && data.dados && data.dados.length) { setItens(data.dados); setSel(null); return; }
      }
      if (!cancel) { setItens(fallback); setSel(null); }
    })();
    return () => { cancel = true; };
    // eslint-disable-next-line
  }, [salaId, catalogo]);

  const salvar = async () => {
    if (!sb) { setStatus("Configure o Supabase em config.js para salvar"); return; }
    setStatus("Salvando…");
    const row = { nome: slug(salaAtual.nome), dados: itens, atualizado_em: new Date().toISOString() };
    if (isUuid(salaAtual.id)) row.sala_id = salaAtual.id;
    const { error } = await sb.from("layouts").upsert(row, { onConflict: "nome" });
    setStatus(error ? "Erro: " + error.message : "Salvo ✓ " + new Date().toLocaleTimeString("pt-BR"));
  };

  const criarSala = async () => {
    const nome = (nova.nome || "").trim();
    const largura_cm = parseInt(nova.largura, 10);
    const profundidade_cm = parseInt(nova.profundidade, 10);
    if (!nome || !largura_cm || !profundidade_cm) { setStatus("Preencha nome e dimensões da sala"); return; }
    let config;
    try { config = nova.config ? JSON.parse(nova.config) : {}; }
    catch (e) { setStatus("Config JSON inválido: " + e.message); return; }

    let novaSala = { id: "local-" + slug(nome), nome, largura_cm, profundidade_cm, config };
    if (sb) {
      const { data, error } = await sb.from("salas")
        .insert({ nome, largura_cm, profundidade_cm, config }).select().single();
      if (error) { setStatus("Erro ao criar sala: " + error.message); return; }
      novaSala = { id: data.id, nome: data.nome, largura_cm: data.largura_cm,
        profundidade_cm: data.profundidade_cm, config: data.config || {} };
    }
    setSalas((s) => [...s, novaSala]);
    setSalaId(novaSala.id);
    setItens([]); setSel(null); setNova(null);
    setStatus(`Sala "${nome}" criada`);
  };

  const criarProjeto = async () => {
    const nome = (novoProj.nome || "").trim();
    if (!nome) { setStatus("Preencha o nome do condomínio"); return; }
    const orcamento_teto = novoProj.orcamento_teto ? Number(novoProj.orcamento_teto) : null;
    let diag = {};
    try { diag = novoProj.diagnostico ? JSON.parse(novoProj.diagnostico) : {}; }
    catch (e) { setStatus("Diagnóstico JSON inválido: " + e.message); return; }
    const rec = {
      nome, sindico: novoProj.sindico || null, contato: novoProj.contato || null,
      orcamento_teto, perfil: diag.perfil || null, infraestrutura: diag.infraestrutura || null,
      observacoes: diag.observacoes || null,
      sala_id: (novoProj.sala_id && isUuid(novoProj.sala_id)) ? novoProj.sala_id : null,
    };
    if (!sb) { setStatus("Configure o Supabase para salvar projetos"); return; }
    const { data, error } = await sb.from("projetos").insert(rec).select().single();
    if (error) { setStatus("Erro ao criar projeto: " + error.message); return; }
    setProjetos((p) => [...p, data]);
    setProjetoId(data.id);
    setNovoProj(null);
    setStatus(`Projeto "${nome}" criado · assessoria ${BRL(data.taxa_assessoria)}`);
  };

  const onArquivoImport = async (file) => {
    if (!file) return;
    setImp({ loading: true, nomeArquivo: file.name });
    try {
      const r = await parseArquivo(file);
      const destino = r.modo === "geometria" ? "planta" : "catalogo";
      setImp({ loading: false, ...r, destino });
    } catch (e) {
      setImp({ loading: false, error: e.message });
    }
  };

  const aplicarImport = async () => {
    if (!imp) return;
    const dest = imp.destino;
    if (imp.modo === "geometria" || dest === "planta") {
      // Adiciona blocos à planta em escala real (proporção travada).
      const blocos = imp.blocos || (imp.linhas || []).map((o) => {
        const m = mapEquip(o); return m.largura_cm && m.profundidade_cm ? { nome: m.nome, w: m.largura_cm, h: m.profundidade_cm, zona: m.zona, preco: m.preco } : null;
      }).filter(Boolean);
      if (!blocos.length) { setStatus("Nada com dimensões para adicionar à planta."); return; }
      let id = nextId, x = 20, y = 20;
      const novos = blocos.map((b) => { const it = { id: id++, nome: b.nome, x, y, w: b.w, h: b.h, zona: b.zona || "livre", preco: b.preco || 0 };
        x += (b.w || 100) + 20; if (x > ROOM.w - 100) { x = 20; y += 260; } return it; });
      setNextId(id); setItens((its) => [...its, ...novos]); setImp(null);
      setStatus(`${novos.length} item(ns) adicionados à planta (proporção travada)`); return;
    }
    if (!sb) { setStatus("Configure o Supabase para importar"); return; }
    if (dest === "catalogo") {
      const rows = (imp.linhas || []).map(mapEquip).filter((r) => r.nome);
      if (!rows.length) { setStatus("Nenhuma linha reconhecida (verifique as colunas)."); return; }
      const { error } = await sb.from("equipamentos").insert(rows);
      if (error) { setStatus("Erro ao importar catálogo: " + error.message); return; }
      setCatalogo((c) => [...c, ...rows.map((r) => ({ nome: r.nome, w: r.largura_cm, h: r.profundidade_cm, zona: r.zona || "livre", preco: r.preco || 0, marca: r.marca, modelo: r.modelo }))]);
      setImp(null); setStatus(`${rows.length} equipamento(s) importados ao catálogo`); return;
    }
    if (dest === "cotacoes") {
      if (!isUuid(projetoId)) { setStatus("Selecione um projeto para importar cotações."); return; }
      const mapped = (imp.linhas || []).map((o) => mapCot(o, projetoId)).filter((r) => r.equipamento);
      if (!mapped.length) { setStatus("Nenhuma cotação reconhecida."); return; }
      const rows = mapped.map(({ fornecedorNome, ...r }) => r);
      const { error } = await sb.from("cotacoes").insert(rows);
      if (error) { setStatus("Erro ao importar cotações: " + error.message); return; }
      setImp(null); setStatus(`${rows.length} cotação(ões) importadas ao projeto`); return;
    }
  };

  const problemas = useMemo(() => {
    const p = {};
    itens.forEach((a) => {
      const fora = a.x < 0 || a.y < 0 || a.x + a.w > ROOM.w || a.y + a.h > ROOM.h;
      const pil = PILAR && colide(a, PILAR);
      const outro = itens.some((b) => b.id !== a.id && colide(a, b));
      const corr = CORREDOR && a.x < CORREDOR.x + CORREDOR.w && a.x + a.w > CORREDOR.x;
      if (fora || pil || outro) p[a.id] = "colisão"; else if (corr) p[a.id] = "corredor";
    });
    return p;
  }, [itens, ROOM.w, ROOM.h, PILAR, CORREDOR]);

  const nCol = Object.values(problemas).filter((v) => v === "colisão").length;
  const nCor = Object.values(problemas).filter((v) => v === "corredor").length;
  const ocup = ((itens.reduce((s, i) => s + i.w * i.h, 0) / (ROOM.w * ROOM.h)) * 100).toFixed(0);
  const subtotal = itens.reduce((s, i) => s + (i.preco || 0), 0);

  // Cenários: soma cumulativa por tier (essencial ⊆ balanceado ⊆ premium).
  const totalCenario = (tier) => itens.reduce((s, i) =>
    CENARIOS[cenarioDe(i)].ordem <= CENARIOS[tier].ordem ? s + (i.preco || 0) : s, 0);
  const cenTotais = { essencial: totalCenario("essencial"), balanceado: totalCenario("balanceado"), premium: totalCenario("premium") };
  const orcTeto = projetoAtual && projetoAtual.orcamento_teto ? Number(projetoAtual.orcamento_teto) : 0;
  const assessoria = orcTeto * TAXA_ASSESSORIA;
  const saldo = orcTeto - subtotal;

  const toSVG = useCallback((e) => {
    const svg = svgRef.current, pt = svg.createSVGPoint();
    pt.x = e.clientX; pt.y = e.clientY;
    return pt.matrixTransform(svg.getScreenCTM().inverse());
  }, []);
  const onDown = (e, item) => { e.preventDefault(); const p = toSVG(e);
    drag.current = { id: item.id, dx: p.x - item.x, dy: p.y - item.y }; setSel(item.id); };
  const onMove = (e) => { if (!drag.current) return; const p = toSVG(e);
    const { id, dx, dy } = drag.current;
    setItens((its) => its.map((it) => it.id === id
      ? { ...it, x: Math.round((p.x - dx) / 5) * 5, y: Math.round((p.y - dy) / 5) * 5 } : it)); };
  const onUp = () => drag.current = null;
  const girar = () => sel && setItens((its) => its.map((it) => it.id === sel ? { ...it, w: it.h, h: it.w } : it));
  const remover = () => { if (!sel) return; setItens((its) => its.filter((it) => it.id !== sel)); setSel(null); };
  const setCenario = (tier) => sel && setItens((its) => its.map((it) => it.id === sel ? { ...it, cenario: tier } : it));
  const adicionar = (m) => { const novo = { id: nextId, nome: m.nome, x: 460, y: 460, w: m.w, h: m.h, zona: m.zona, preco: m.preco };
    setNextId((n) => n + 1); setItens((its) => [...its, novo]); setSel(novo.id); };

  const selItem = itens.find((i) => i.id === sel);

  return (
  <div style={{ minHeight: "100vh" }}>
    <header style={{ borderBottom: "2px solid #C9A227", padding: "18px 24px 14px",
      display: "flex", alignItems: "baseline", gap: 18, flexWrap: "wrap" }}>
      <h1 style={{ fontFamily: "'Bebas Neue'", fontSize: 34, letterSpacing: ".03em" }}>
        HERITAGE <span style={{ color: "#C9A227" }}>PLANNER</span></h1>
      <div className="no-print" style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
        <select className="sel" value={projetoId} onChange={(e) => setProjetoId(e.target.value)} aria-label="Selecionar projeto">
          <option value="">— Sem projeto —</option>
          {projetos.map((p) => <option key={p.id} value={p.id}>{p.nome}</option>)}
        </select>
        <button className="act" onClick={() => setNovoProj({ nome: "", sindico: "", contato: "", orcamento_teto: "", sala_id: salaId && isUuid(salaId) ? salaId : "", diagnostico: DIAG_TEMPLATE })}>+ Novo projeto</button>
        <span style={{ width: 1, height: 22, background: "#33343A" }} />
        <select className="sel" value={salaId} onChange={(e) => setSalaId(e.target.value)} aria-label="Selecionar sala">
          {salas.map((s) => <option key={s.id} value={s.id}>{s.nome} · {s.largura_cm}×{s.profundidade_cm}</option>)}
        </select>
        <button className="act" onClick={() => setNova({ nome: "", largura: "", profundidade: "", config: NOVA_CONFIG_TEMPLATE })}>+ Nova sala</button>
        <span style={{ width: 1, height: 22, background: "#33343A" }} />
        <button className="act" onClick={() => setImp({})} style={{ borderColor: "#4A90C4", color: "#8Fc3e8" }}>⭱ Importar documento</button>
      </div>
      <span style={{ fontSize: 12, color: "#8A8A8F", letterSpacing: ".18em", textTransform: "uppercase" }}>
        escala real · validação ao vivo · proporção travada</span>
      <span style={{ fontSize: 12, color: "#5FBF7A", marginLeft: "auto" }} className="no-print">{status}</span>
    </header>

    {nova && (
      <div className="no-print" style={{ padding: "14px 24px", borderBottom: "1px solid #232427",
        display: "flex", gap: 12, alignItems: "flex-start", flexWrap: "wrap", background: "#0E0F11" }}>
        <div style={{ display: "grid", gap: 6, width: 180 }}>
          <label style={{ fontSize: 11, color: "#8A8A8F", letterSpacing: ".08em" }}>NOME</label>
          <input className="fld" value={nova.nome} placeholder="Ex.: Condomínio X"
            onChange={(e) => setNova({ ...nova, nome: e.target.value })} />
        </div>
        <div style={{ display: "grid", gap: 6, width: 110 }}>
          <label style={{ fontSize: 11, color: "#8A8A8F", letterSpacing: ".08em" }}>LARGURA (cm)</label>
          <input className="fld" type="number" value={nova.largura}
            onChange={(e) => setNova({ ...nova, largura: e.target.value })} />
        </div>
        <div style={{ display: "grid", gap: 6, width: 130 }}>
          <label style={{ fontSize: 11, color: "#8A8A8F", letterSpacing: ".08em" }}>PROFUNDIDADE (cm)</label>
          <input className="fld" type="number" value={nova.profundidade}
            onChange={(e) => setNova({ ...nova, profundidade: e.target.value })} />
        </div>
        <div style={{ display: "grid", gap: 6, flex: 1, minWidth: 260 }}>
          <label style={{ fontSize: 11, color: "#8A8A8F", letterSpacing: ".08em" }}>
            CONFIG (JSON — pisos, pilar, corredor, paredes)</label>
          <textarea className="fld" rows={6} value={nova.config}
            onChange={(e) => setNova({ ...nova, config: e.target.value })} />
        </div>
        <div style={{ display: "grid", gap: 6, marginTop: 22 }}>
          <button className="act" onClick={criarSala} style={{ borderColor: "#C9A227", color: "#C9A227" }}>Criar sala</button>
          <button className="act" onClick={() => setNova(null)}>Cancelar</button>
        </div>
      </div>
    )}

    {novoProj && (
      <div className="no-print" style={{ padding: "14px 24px", borderBottom: "1px solid #232427",
        display: "flex", gap: 12, alignItems: "flex-start", flexWrap: "wrap", background: "#0E0F11" }}>
        <div style={{ display: "grid", gap: 6, width: 200 }}>
          <label style={{ fontSize: 11, color: "#8A8A8F", letterSpacing: ".08em" }}>CONDOMÍNIO</label>
          <input className="fld" value={novoProj.nome} placeholder="Ex.: Residencial Aurora"
            onChange={(e) => setNovoProj({ ...novoProj, nome: e.target.value })} />
        </div>
        <div style={{ display: "grid", gap: 6, width: 150 }}>
          <label style={{ fontSize: 11, color: "#8A8A8F", letterSpacing: ".08em" }}>SÍNDICO</label>
          <input className="fld" value={novoProj.sindico}
            onChange={(e) => setNovoProj({ ...novoProj, sindico: e.target.value })} />
        </div>
        <div style={{ display: "grid", gap: 6, width: 150 }}>
          <label style={{ fontSize: 11, color: "#8A8A8F", letterSpacing: ".08em" }}>CONTATO</label>
          <input className="fld" value={novoProj.contato}
            onChange={(e) => setNovoProj({ ...novoProj, contato: e.target.value })} />
        </div>
        <div style={{ display: "grid", gap: 6, width: 150 }}>
          <label style={{ fontSize: 11, color: "#8A8A8F", letterSpacing: ".08em" }}>ORÇAMENTO-TETO (R$)</label>
          <input className="fld" type="number" value={novoProj.orcamento_teto}
            onChange={(e) => setNovoProj({ ...novoProj, orcamento_teto: e.target.value })} />
          <span style={{ fontSize: 11, color: "#C9A227" }}>
            Assessoria 0,5%: {BRL(Math.round((Number(novoProj.orcamento_teto) || 0) * TAXA_ASSESSORIA))}</span>
        </div>
        <div style={{ display: "grid", gap: 6, width: 170 }}>
          <label style={{ fontSize: 11, color: "#8A8A8F", letterSpacing: ".08em" }}>SALA VINCULADA</label>
          <select className="sel" value={novoProj.sala_id}
            onChange={(e) => setNovoProj({ ...novoProj, sala_id: e.target.value })}>
            <option value="">— nenhuma —</option>
            {salas.filter((s) => isUuid(s.id)).map((s) => <option key={s.id} value={s.id}>{s.nome}</option>)}
          </select>
        </div>
        <div style={{ display: "grid", gap: 6, flex: 1, minWidth: 240 }}>
          <label style={{ fontSize: 11, color: "#8A8A8F", letterSpacing: ".08em" }}>DIAGNÓSTICO (JSON — perfil, infraestrutura)</label>
          <textarea className="fld" rows={6} value={novoProj.diagnostico}
            onChange={(e) => setNovoProj({ ...novoProj, diagnostico: e.target.value })} />
        </div>
        <div style={{ display: "grid", gap: 6, marginTop: 22 }}>
          <button className="act" onClick={criarProjeto} style={{ borderColor: "#C9A227", color: "#C9A227" }}>Criar projeto</button>
          <button className="act" onClick={() => setNovoProj(null)}>Cancelar</button>
        </div>
      </div>
    )}

    {projetoAtual && (
      <div style={{ padding: "10px 24px", borderBottom: "1px solid #232427", background: "#0C0D0F",
        display: "flex", gap: 14, alignItems: "center", flexWrap: "wrap" }}>
        <span style={{ fontFamily: "'Bebas Neue'", fontSize: 18, color: "#C9A227", letterSpacing: ".05em" }}>
          {projetoAtual.nome}</span>
        {projetoAtual.sindico && <span style={{ fontSize: 12, color: "#8A8A8F" }}>Síndico: {projetoAtual.sindico}</span>}
        {orcTeto > 0 && <Chip neutro txt={`Teto ${BRL(orcTeto)}`} />}
        {orcTeto > 0 && <Chip gold txt={`Assessoria 0,5% ${BRL(Math.round(assessoria))}`} />}
        <Chip neutro txt={`Layout ${BRL(subtotal)}`} />
        {orcTeto > 0 && <Chip ok={saldo >= 0} warn={saldo < 0} txt={`Saldo ${BRL(saldo)}`} />}
      </div>
    )}

    {imp && (
      <div className="no-print" onClick={() => setImp(null)} style={{ position: "fixed", inset: 0, zIndex: 50,
        background: "rgba(0,0,0,.6)", display: "flex", alignItems: "center", justifyContent: "center", padding: 16 }}>
        <div onClick={(e) => e.stopPropagation()} style={{ background: "#111214", border: "1px solid #33343A",
          borderRadius: 12, width: 620, maxWidth: "100%", maxHeight: "88vh", overflow: "auto", padding: 20 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
            <span style={{ fontFamily: "'Bebas Neue'", fontSize: 22, color: "#8Fc3e8", letterSpacing: ".04em" }}>IMPORTAR DOCUMENTO</span>
            <button className="act" onClick={() => setImp(null)}>Fechar</button>
          </div>

          {!imp.modo && !imp.loading && !imp.error && (
            <div>
              <p style={{ fontSize: 13, color: "#B9B9B4", marginBottom: 12 }}>
                Selecione um arquivo. O app lê no navegador e você escolhe o destino.</p>
              <input type="file" accept=".csv,.xlsx,.xls,.pdf,.dxf,.dwg" className="fld"
                onChange={(e) => onArquivoImport(e.target.files && e.target.files[0])} />
              <p style={{ fontSize: 11.5, color: "#6E6E73", marginTop: 10 }}>
                Planilha e CSV → catálogo/cotações · PDF → orçamentos/listas · DXF/DWG → planta (escala real).
                A leitura de DWG usa WebAssembly e pode levar alguns segundos.</p>
            </div>
          )}

          {imp.loading && <p style={{ color: "#C9A227", fontSize: 14 }}>Lendo {imp.nomeArquivo || "arquivo"}…</p>}

          {imp.error && (
            <div>
              <p style={{ color: "#E04545", fontSize: 13.5, marginBottom: 12 }}>{imp.error}</p>
              <button className="act" onClick={() => setImp({})}>Escolher outro arquivo</button>
            </div>
          )}

          {imp.modo && (
            <div>
              <p style={{ fontSize: 13, color: "#5FBF7A", marginBottom: 12 }}>✓ {imp.resumo}</p>
              <div style={{ fontSize: 11, color: "#8A8A8F", letterSpacing: ".08em", marginBottom: 6 }}>DESTINO</div>
              <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 14 }}>
                {(imp.modo === "geometria" ? [["planta", "Adicionar à planta"]]
                  : [["catalogo", "Catálogo"], ["cotacoes", "Cotações do projeto"], ["planta", "Adicionar à planta"]]
                ).map(([k, lbl]) => (
                  <button key={k} className="act" onClick={() => setImp({ ...imp, destino: k })}
                    style={{ borderColor: imp.destino === k ? "#C9A227" : "#33343A", color: imp.destino === k ? "#C9A227" : "#B9B9B4" }}>{lbl}</button>
                ))}
              </div>
              {imp.destino === "cotacoes" && !isUuid(projetoId) && (
                <p style={{ color: "#E09A45", fontSize: 12, marginBottom: 10 }}>Selecione um projeto no topo para importar cotações.</p>)}
              <div style={{ maxHeight: 200, overflow: "auto", border: "1px solid #26272B", borderRadius: 8, padding: 10, marginBottom: 14 }}>
                {(imp.blocos || imp.linhas || []).slice(0, 12).map((r, i) => (
                  <div key={i} style={{ fontSize: 12, color: "#C9C9C4", padding: "2px 0", fontFamily: "ui-monospace, monospace" }}>
                    {imp.blocos ? `${r.nome} — ${r.w}×${r.h} cm`
                      : Object.values(r).filter((v) => v !== "" && v != null).slice(0, 6).join(" · ")}
                  </div>
                ))}
                {((imp.blocos || imp.linhas || []).length > 12) && <div style={{ fontSize: 11, color: "#6E6E73" }}>… +{(imp.blocos || imp.linhas).length - 12}</div>}
              </div>
              <div style={{ display: "flex", gap: 8 }}>
                <button className="act" onClick={aplicarImport} style={{ borderColor: "#C9A227", color: "#C9A227" }}>Aplicar</button>
                <button className="act" onClick={() => setImp({})}>Trocar arquivo</button>
              </div>
            </div>
          )}
        </div>
      </div>
    )}

    <div style={{ display: "flex", gap: 16, padding: 16, alignItems: "flex-start", flexWrap: "wrap" }}>
      <aside className="no-print" style={{ width: 228, flexShrink: 0 }}>
        <div style={{ fontFamily: "'Bebas Neue'", fontSize: 19, color: "#C9A227", letterSpacing: ".06em", marginBottom: 8 }}>BIBLIOTECA</div>
        <div style={{ display: "grid", gap: 5, maxHeight: "56vh", overflowY: "auto", paddingRight: 4 }}>
          {catalogo.map((m) => (
            <button key={m.nome} className="lib-btn" onClick={() => adicionar(m)}>
              <span style={{ display: "flex", alignItems: "center", gap: 7 }}>
                <span style={{ width: 8, height: 8, borderRadius: 2, background: (ZONAS[m.zona] || ZONAS.livre).cor }} />{m.nome}</span>
              <span style={{ color: "#6E6E73", fontWeight: 400 }}>{m.w}×{m.h}</span>
            </button>))}
        </div>
        <div style={{ marginTop: 14, display: "grid", gap: 6 }}>
          <button className="act" onClick={girar} disabled={!sel}>↻ Girar 90° {selItem ? `(${selItem.nome})` : ""}</button>
          <button className="act" onClick={remover} disabled={!sel}>✕ Remover selecionada</button>
          {selItem && (
            <div style={{ display: "flex", gap: 4 }}>
              {Object.entries(CENARIOS).map(([k, c]) => (
                <button key={k} className="act" onClick={() => setCenario(k)} title={`Cenário ${c.label}`}
                  style={{ flex: 1, padding: "7px 4px", fontSize: 10.5,
                    borderColor: cenarioDe(selItem) === k ? c.cor : "#33343A",
                    color: cenarioDe(selItem) === k ? c.cor : "#8A8A8F" }}>{c.label}</button>
              ))}
            </div>
          )}
          <button className="act" onClick={salvar} style={{ borderColor: "#C9A227", color: "#C9A227" }}>💾 Salvar layout</button>
          <button className="act" onClick={() => window.print()}>⎙ Imprimir / PDF</button>
        </div>
      </aside>

      <main style={{ flex: 1, minWidth: 340 }}>
        <div className="no-print" style={{ display: "flex", gap: 10, marginBottom: 10, flexWrap: "wrap" }}>
          <Chip ok={nCol === 0} txt={nCol === 0 ? "Sem colisões" : `${nCol} colisão(ões)`} />
          <Chip ok={nCor === 0} warn txt={nCor === 0 ? "Corredor livre" : `${nCor} no corredor`} />
          <Chip neutro txt={`Ocupação ${ocup}%`} />
          <Chip neutro txt={`Equipamentos: ${itens.length}`} />
          <Chip gold txt={`R$ ${subtotal.toLocaleString("pt-BR")}`} />
        </div>
        <div className="no-print" style={{ display: "flex", gap: 10, marginBottom: 10, flexWrap: "wrap", alignItems: "center" }}>
          <span style={{ fontSize: 11, color: "#6E6E73", letterSpacing: ".1em", textTransform: "uppercase" }}>Cenários</span>
          {Object.entries(CENARIOS).map(([k, c]) => (
            <span key={k} style={{ border: `1px solid ${c.cor}`, color: c.cor, borderRadius: 999,
              padding: "5px 13px", fontSize: 12.5, fontWeight: 700 }}>{c.label} {BRL(cenTotais[k])}</span>
          ))}
        </div>

        <svg ref={svgRef} viewBox={`${-60} ${-60} ${ROOM.w + 120} ${ROOM.h + 120}`}
          style={{ width: "100%", background: "#0C0C0E", borderRadius: 12, border: "1px solid #232427",
            touchAction: "none", userSelect: "none" }}
          onPointerMove={onMove} onPointerUp={onUp} onPointerLeave={onUp}>
          {PISO.length
            ? PISO.map((f) => <rect key={f.nome} x={0} y={f.y0} width={ROOM.w} height={f.y1 - f.y0} fill={f.cor} />)
            : <rect x={0} y={0} width={ROOM.w} height={ROOM.h} fill="#141518" />}
          {cfg.pista_label && (
            <text x={ROOM.w / 2} y={775} fill="#E8B4B4" fontSize={26} fontWeight={700}
              letterSpacing={8} textAnchor="middle">{cfg.pista_label}</text>)}
          {CORREDOR && <rect x={CORREDOR.x} y={0} width={CORREDOR.w} height={ROOM.h} fill="#C9A227" opacity={0.06} />}
          {CORREDOR && <line x1={CORREDOR.x + 50} y1={20} x2={CORREDOR.x + 50} y2={ROOM.h - 20}
            stroke="#C9A227" strokeWidth={2.5} strokeDasharray="14 12" opacity={0.5} />}
          <rect x={-10} y={-10} width={ROOM.w + 20} height={ROOM.h + 20} fill="none" stroke="#3A3A3C" strokeWidth={20} />
          {paredes.top && <text x={ROOM.w / 2} y={-26} fill="#8A8A8F" fontSize={22} textAnchor="middle">{paredes.top}</text>}
          {paredes.bottom && <text x={ROOM.w / 2} y={ROOM.h + 44} fill="#8A8A8F" fontSize={22} textAnchor="middle">{paredes.bottom}</text>}
          {paredes.left && <text x={-30} y={ROOM.h / 2} fill="#8A8A8F" fontSize={22} textAnchor="middle"
            transform={`rotate(-90 -30 ${ROOM.h / 2})`}>{paredes.left}</text>}
          {paredes.right && <text x={ROOM.w + 34} y={ROOM.h / 2} fill="#5FC8E8" fontSize={22} textAnchor="middle"
            transform={`rotate(-90 ${ROOM.w + 34} ${ROOM.h / 2})`}>{paredes.right}</text>}
          {PILAR && <rect x={PILAR.x} y={PILAR.y} width={PILAR.w} height={PILAR.h} fill="#2B2B2E" stroke="#8A8A8F" strokeWidth={3} />}
          {PILAR && <text x={PILAR.x + PILAR.w / 2} y={PILAR.y - 8} fill="#C9A227" fontSize={16} textAnchor="middle">{PILAR.w}×{PILAR.h}</text>}
          {itens.map((it) => {
            const prob = problemas[it.id];
            const cor = prob === "colisão" ? "#E04545" : prob === "corredor" ? "#E09A45" : (ZONAS[it.zona] || ZONAS.livre).cor;
            const vert = it.h > it.w * 1.3, cx = it.x + it.w / 2, cy = it.y + it.h / 2;
            return (
              <g key={it.id} onPointerDown={(e) => onDown(e, it)} style={{ cursor: "grab" }}>
                <rect x={it.x} y={it.y} width={it.w} height={it.h} rx={6}
                  fill={sel === it.id ? "#1E1F23" : "#141518"} stroke={cor}
                  strokeWidth={sel === it.id ? 7 : 4} strokeDasharray={prob ? "10 7" : "none"} />
                <text x={cx} y={cy - 1} fill="#F2F2F0" fontSize={Math.min(it.w, it.h) >= 85 ? 22 : 17}
                  fontWeight={600} textAnchor="middle"
                  transform={vert ? `rotate(-90 ${cx} ${cy})` : undefined}>{it.nome}</text>
                <text x={cx} y={cy + 18} fill="#9A9AA0" fontSize={14} textAnchor="middle"
                  transform={vert ? `rotate(-90 ${cx} ${cy})` : undefined}>{it.w}×{it.h}</text>
              </g>);
          })}
        </svg>
        <p className="no-print" style={{ color: "#6E6E73", fontSize: 12.5, marginTop: 8 }}>
          Arraste as máquinas (grade 5 cm). Vermelho tracejado = colisão/fora da sala · laranja = corredor da porta.
          "Salvar layout" grava no Supabase quando configurado em config.js.
        </p>
      </main>
    </div>
  </div>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
